<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <title>Crosstrik | Il Nostro Team di Coach a Cavriglia</title>
    <meta
      name="description"
      content="Conosci il team Crosstrik: Coach Mauro e i nostri istruttori qualificati di Cross Training, Functional Training, Yoga e nutrizione nel Valdarno, a Cavriglia."
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo_full.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <!-- JAVASCRIPT INIETTERÀ LA NAVBAR QUI -->
    <div id="navbar-container"></div>

    <div class="container">
      <main>
        <!-- HERO -->
        <section class="hero-custom">
          <div class="hero-background h-100">
            <img
              src="assets/img/background.webp"
              alt="Allenamento Cross Training a Cavriglia, Via Casa Maria 272"
            />
          </div>
          <div class="hero-content">
            <div class="hero-content-logo mt-4 mt-lg-5">
              <img
                src="assets/img/logo_full.png"
                alt="Logo Crosstrik"
                class="hero-logo mb-3"
              />
            </div>
            <div class="hero-content-text p-3">
              <h1 class="hero-titolo mb-2">CROSSTRIk</h1>
              <h2 class="hero-sottotitolo mb-3">
                Cross Training & Functional Training a Cavriglia
              </h2>
              <p class="hero-testo">
                Coach qualificati e appassionati, pronti a spingerti oltre i
                tuoi limiti in totale sicurezza.
              </p>
            </div>
          </div>
        </section>

        <!-- LISTA COACH (card complete generate da data.js) -->
        <section id="lista-coach" class="sezione-custom py-4 mt-5">
          <div
            class="row justify-content-center"
            id="lista-coach-wrapper"
          ></div>
        </section>
      </main>
    </div>

    <!-- FINE CONTENITORE PRINCIPALE -->
    <!-- Il footer include Instagram + Sponsor + Footer -->
    <div id="footer-container"></div>
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
